<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Yo Go! Admin</title>
    <meta name="description" content="The page you were looking for doesn't exist." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap"
    />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <script>
      try {
        var t = localStorage.getItem('yogo-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="not-found">
      <img src="./public/apple-touch-icon.png" alt="Yo Go! logo" width="72" height="72" />
      <p class="not-found__code">404</p>
      <h1>Page not found</h1>
      <p>The page you were looking for doesn’t exist or has moved.</p>
      <a class="button button--primary" href="/">Back to dashboard</a>
    </main>
  </body>
</html>
